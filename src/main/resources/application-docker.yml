spring:
  datasource:
    url: jdbc:postgresql://db:5432/tenpo
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

async:
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 50
